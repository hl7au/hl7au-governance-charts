name: Publish charts

# Publishes the charts into the existing HL7 AU CloudFront distribution:
# the SVGs go to the charts/ prefix of its S3 origin, then that prefix is
# invalidated. Nothing else in the bucket or the distribution is touched.
on:
  push:
    branches: [main]
    paths:
      - governance.md
      - events.md
      - src/**
      - build.py
      - lambda_function.py
      - .github/workflows/publish.yml
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write        # OIDC federation into AWS — no long-lived keys

env:
  AWS_REGION: ap-southeast-2
  # The distribution's S3 origin has origin path /site, so a viewer request for
  # /charts/x.svg is fetched from s3://<bucket>/site/charts/x.svg. Publishing to
  # charts/ at the bucket root would upload happily and serve nothing.
  S3_PREFIX: site/charts

jobs:
  publish:
    runs-on: ubuntu-latest
    # The `secrets` context cannot be used in an `if:` expression, so the optional
    # Lambda is surfaced as an env var and the steps below test that.
    env:
      LAMBDA_FUNCTION: ${{ secrets.AWS_LAMBDA_FUNCTION }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the site
        run: python build.py --site site

      - name: Check every chart parses as XML
        run: |
          python - <<'PY'
          import xml.dom.minidom, pathlib
          for path in sorted(pathlib.Path("site/charts").glob("*.svg")):
              xml.dom.minidom.parse(str(path))
              print(f"ok  {path}  {path.stat().st_size:>6} bytes")
          PY

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # hl7auprojects is shared with the aucore-verified site, so this must stay
      # narrow: source and destination are both the charts directory, meaning
      # --delete can only remove a chart this build no longer produces.
      - name: Sync charts to S3
        run: |
          aws s3 sync site/charts/ "s3://${{ secrets.AWS_BUCKET }}/$S3_PREFIX/" --delete \
            --exclude "*" --include "*.svg" \
            --content-type "image/svg+xml; charset=utf-8" \
            --cache-control "public, max-age=300, s-maxage=86400"
          aws s3 sync site/charts/ "s3://${{ secrets.AWS_BUCKET }}/$S3_PREFIX/" \
            --exclude "*" --include "*.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "public, max-age=300"

      # Optional second phase: only runs once a /render/* Lambda exists.
      # The function bundles governance.md, so it has to be refreshed too.
      - name: Update the render Lambda
        if: env.LAMBDA_FUNCTION != ''
        run: |
          zip -qr renderer.zip src lambda_function.py governance.md \
            -x "*/__pycache__/*"
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION" \
            --zip-file fileb://renderer.zip \
            --no-cli-pager > /dev/null
          aws lambda wait function-updated \
            --function-name "$LAMBDA_FUNCTION"

      # Scoped, not /*. The distribution serves other things; flushing all of it
      # on a chart edit would be needless origin load.
      - name: Invalidate the charts paths
        run: |
          PATHS="/charts/*"
          if [ -n "$LAMBDA_FUNCTION" ]; then PATHS="$PATHS /render/*"; fi
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.AWS_DISTRIBUTION_ID }}" \
            --paths $PATHS --no-cli-pager > /dev/null
